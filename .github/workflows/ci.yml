name: CI

on:
  push:
  pull_request:

jobs:
  check:
    name: fmt / clippy / test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo + build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --all --check

      - name: Clippy (deny warnings)
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --all-features

      # - name: Requirements conformance (req conform)
      #   run: req conform
      #   # NOTE: The `req` CLI is a private binary and is not available on CI
      #   # runners. Wire this step in later if/when `req` is published or made
      #   # installable on CI (e.g. via a release artifact or private registry).
